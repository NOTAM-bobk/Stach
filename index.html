<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Staches" />
    <meta name="format-detection" content="telephone=no" />
    <title>Staches — save it for later</title>

    <!-- Redirect first-time visitors to landing page unless they pass ?showLanding=1 -->
    <script>
      (function(){
        try {
          var params = new URLSearchParams(window.location.search);
          // If developer/testing wants to force the landing page, add ?showLanding=1 to URL.
          if (!params.has('showLanding')) {
            if (!localStorage.getItem('stach_seen_landing')) {
              window.location.replace('/landing.html');
            }
          }
        } catch (e) {
          // ignore storage/access errors
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
